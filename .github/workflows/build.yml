name: exe yap
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pygame websockets pyinstaller pillow
      - run: pyinstaller --onefile --noconsole --name ORRVETH --icon=ikon.png --collect-submodules websockets oyun.py
      - uses: actions/upload-artifact@v4
        with:
          name: ORRVETH
          path: dist/ORRVETH.exe
